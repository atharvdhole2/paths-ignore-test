name: Bob Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-bob-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify IBM Bob Review marker exists for HEAD SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$HEAD_SHA"
          if [ -f ".bob-review/${sha}" ]; then
            echo "Found IBM Bob Review marker for ${sha}."
            exit 0
          fi

          found=0
          while IFS= read -r reviewed_sha; do
            [ -z "$reviewed_sha" ] && continue
            if git merge-base --is-ancestor "$reviewed_sha" HEAD 2>/dev/null; then
              echo "Found a IBM Bob Review marker commit for ${reviewed_sha}, which is still an ancestor of HEAD."
              found=1
              break
            fi
          done < <(git log --format=%s HEAD | grep -oE '^bob-review: mark [0-9a-f]{40} as reviewed' | grep -oE '[0-9a-f]{40}')

          if [ "$found" -eq 1 ]; then
            exit 0
          fi

          echo "::error::No IBM Bob Review marker found for commit ${sha}, and no valid marker commit was found in this branch's history."
          exit 1
