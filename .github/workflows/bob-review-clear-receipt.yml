name: Clear Bob Review Receipt

on:
  pull_request:
    types: [labeled]

jobs:
  clear-receipt:
    if: github.event.label.name == 'clear-bob-receipt'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Mark approval gate as passing without triggering a rerun
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name='check-bob-review-approval' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion='success'

      - name: Remove the triggering label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --remove-label "clear-bob-receipt"
